<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Bogawantalawa Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
  href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap"
  rel="stylesheet"
>
  <link rel="stylesheet" href="css/style.css">


  <style>

 .login-heading {
  height: 137px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.login-logo {
  display: block;
  width: 140px;
  height: 68px;
  object-fit: contain;
  flex-shrink: 0;
}

  .login-heading h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 2rem;
    text-align: center;
  }

  .password-field {
    position: relative;
  }

  .password-field input {
    width: 100%;
    padding-right: 48px;
  }

  .password-toggle {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--green-800);
    cursor: pointer;
  }

  .password-toggle:focus-visible {
    outline: 2px solid var(--green-800);
    outline-offset: 1px;
  }

  #password-eye-slash[hidden] {
    display: none;
  }

/* Transparent login card */
.login-card {
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.22),
    rgba(16, 61, 50, 0.30)
  );

  backdrop-filter: blur(18px) saturate(125%);
  -webkit-backdrop-filter: blur(18px) saturate(125%);

  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.35),
    0 20px 50px rgba(0, 25, 18, 0.25);
}
.login-card .login-heading h1,
.login-card label {
  color: #fff;
}

.login-card input {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.55);
  color: #fff;
}

.login-card input::placeholder {
  color: #d7e5dd;
  opacity: 1;
}

.login-card input:focus {
  outline: 2px solid var(--gold-400);
  outline-offset: 2px;
  border-color: var(--gold-400);
}

.login-card .password-toggle {
  color: #fff;
}

.login-card .btn-primary {
  background: var(--gold-400);
  color: #103d32;
}

.login-card .btn-primary:hover {
  background: var(--gold-500);
}

.login-card .btn-outline {
  background: transparent;
  border-color: rgba(255, 255, 255, 0.6);
  color: #fff;
}

.login-card .btn-outline:hover {
  background: rgba(255, 255, 255, 0.12);
}

.login-card button:focus-visible,
.login-card a:focus-visible {
  outline: 2px solid var(--gold-400);
  outline-offset: 3px;
}


</style>
  
</head>
<body>
  <main class="login-wrap">
   <form class="login-card" action="api/login.php" method="POST">  
 <div class="login-heading">
  <img
    class="login-logo"
    src="images/bogo-logo.png"
    alt="Bogo DayTrails"
    width="140"
    height="68"
  >
  <h1>Login</h1>
</div>
      <div class="form-group">
        <label for="username">Username</label>
        <input
  id="username"
  name="username"
  type="text"
  placeholder="Enter username"
  autocomplete="username"
  maxlength="50"
  required
>
      </div>


 <div class="form-group" style="margin-top:12px;">
  <label for="password">Password</label>

  <div class="password-field">
    <input
      id="password"
      name="password"
      type="password"
      placeholder="Enter password"
      autocomplete="current-password"
      required
    >

    <button
      class="password-toggle"
      id="password-toggle"
      type="button"
      aria-label="Show password"
      aria-controls="password"
      aria-pressed="false"
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        aria-hidden="true"
      >
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
        <circle cx="12" cy="12" r="3"/>
        <path id="password-eye-slash" d="M3 3l18 18" hidden/>
      </svg>
    </button>
  </div>
</div>


<button
  class="btn btn-primary"
  type="submit"
  style="display:flex; align-items:center; justify-content:center; width:260px; max-width:100%; height:46px; min-height:46px; box-sizing:border-box; padding:0 16px; margin:20px auto 0; font-size:16px; line-height:1.2;"
>
  Continue to dashboard
</button>

<a
  class="btn btn-outline"
  href="index.html"
  style="display:flex; align-items:center; justify-content:center; width:260px; max-width:100%; height:46px; min-height:46px; box-sizing:border-box; padding:0 16px; margin:10px auto 0; font-size:16px; line-height:1.2;"
>
  Back to website
</a>
    </form>
  </main>
  <script src="js/script.js"></script>


<script>
  const passwordInput = document.getElementById("password");
  const passwordToggle = document.getElementById("password-toggle");
  const passwordEyeSlash = document.getElementById("password-eye-slash");

  passwordToggle.addEventListener("click", () => {
    const showPassword = passwordInput.type === "password";

    passwordInput.type = showPassword ? "text" : "password";

    passwordToggle.setAttribute("aria-pressed", String(showPassword));
    passwordToggle.setAttribute(
      "aria-label",
      showPassword ? "Hide password" : "Show password"
    );

    passwordEyeSlash.toggleAttribute("hidden", !showPassword);
  });
</script>

</body>
</html>
